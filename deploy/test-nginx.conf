server {
    listen 80;
    server_name ${PUBLIC_IP};
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://${PUBLIC_IP}$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ${PUBLIC_IP};
    ssl_certificate /etc/letsencrypt/live/nelson-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nelson-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/nelson/current/web;
    index index.html;
    client_max_body_size 9m;
    # Compress text responses: field crews load the app over weak cellular signal.
    # Django masks CSRF tokens per response, so compressing API JSON is BREACH-safe.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 70s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8001/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control no-store always;
    }
    location = /__release {
        alias /srv/nelson/current/release.txt;
        default_type text/plain;
        add_header Cache-Control no-store always;
    }
    location = /sw.js {
        add_header Cache-Control no-cache always;
        try_files $uri =404;
    }
    location /assets/ {
        alias /srv/nelson/shared/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        add_header Cache-Control no-cache always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri /index.html;
    }
}
