server {
    listen 80 default_server;
    server_name ${PUBLIC_DOMAIN} ${PUBLIC_IP};
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://${PUBLIC_DOMAIN}$request_uri;
    }
}

# The bare address keeps its own certificate but sends people to the domain.
server {
    listen 443 ssl default_server;
    server_name ${PUBLIC_IP};
    ssl_certificate /etc/letsencrypt/live/nelson-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nelson-test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://${PUBLIC_DOMAIN}$request_uri;
}

server {
    listen 443 ssl;
    server_name ${PUBLIC_DOMAIN};
    ssl_certificate /etc/letsencrypt/live/nelson-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nelson-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/nelson/current/web;
    index index.html;
    client_max_body_size 9m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    # Cloudflare proxies the domain; take the visitor's address only from its ranges
    # (https://www.cloudflare.com/ips/).
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 70s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8001/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control no-store always;
    }
    location = /__release {
        alias /srv/nelson/current/release.txt;
        default_type text/plain;
        add_header Cache-Control no-store always;
    }
    location = /sw.js {
        add_header Cache-Control no-cache always;
        try_files $uri =404;
    }
    location /assets/ {
        alias /srv/nelson/shared/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        add_header Cache-Control no-cache always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri /index.html;
    }
}
