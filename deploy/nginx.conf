# Include inside the application's TLS server block (listen 443 ssl http2). Replace the paths/upstream
# for your deployment. The public origin must match NELSON_APP_URL.
root /srv/nelson/web;
index index.html;
client_max_body_size 9m;
# Compress text responses: field crews load the app over weak cellular signal.
# Django masks CSRF tokens per response, so compressing API JSON is BREACH-safe.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml;

location /api/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri /index.html;
}
