name: Validate and package web application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-package
  cancel-in-progress: true

jobs:
  api-quality:
    uses: ./.github/workflows/api-quality.yml
    secrets:
      CLEANFORCE_DEPLOY_KEY: ${{ secrets.CLEANFORCE_DEPLOY_KEY }}
    permissions:
      contents: read

  build:
    needs: api-quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload application artifact for the API host
        uses: actions/upload-artifact@v4
        with:
          name: nelson-web
          path: ./dist

# The authenticated app needs /api on the same HTTPS origin. GitHub Pages cannot
# serve that API or SPA deep links. Deployment belongs to the application host;
# this workflow intentionally no longer publishes the obsolete static demo.
