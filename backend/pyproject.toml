[project]
name = "nelson-electric-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cleanforce-backend-platform[postgres] @ git+https://github.com/recnepspencer/CleanForce.git@80ea29899246a4680f01624e03b896522770b6dd",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-django>=4.9,<5", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["ALL"]
